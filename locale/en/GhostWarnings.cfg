[ghost-warnings]
not-in-construction-network=Not in construction network

[mod-setting-name]
gw-enable-warnings=Enable ghost warnings
gw-warning-cooldown=Warning cooldown length
gw-play-warning-sound=Play warning sound

[mod-setting-description]
gw-enable-warnings=A warning is given when a ghost is placed and there isn't an item in the logistic network to build it.
gw-warning-cooldown=Each warning is only given once per held click. This setting adds a cooldown regardless of held clicks.\nIn seconds.

[string-mod-setting]
gw-enable-warnings-on=On
gw-enable-warnings-remote-only=Remote view only
gw-enable-warnings-off=Off
